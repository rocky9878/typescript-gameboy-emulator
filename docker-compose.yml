services:
    gameboy.test:
        build:
            context: ./docker/php-fpm
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'sail-8.4/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - "8080:80"
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
            - '${SUPERVISOR_PORT:-9001}:9001'
            - '${REVERB_SERVER_PORT:-8000}:8000'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        expose:
            - 9000
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - redis
    nginx:
        build:
            context: ./docker/nginx
            dockerfile: Dockerfile
        ports:
            - '${APP_PORT:-80}:80'
            - '${SSL_PORT:-443}:443'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - gameboy.test
    redis:
        image: 'redis:alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s
networks:
    sail:
        driver: bridge
volumes:
    sail-mariadb:
        driver: local
    sail-redis:
        driver: local
